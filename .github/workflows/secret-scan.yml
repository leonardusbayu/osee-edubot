# Run the secret scan on every push and PR.
# Catches credentials that bypass the pre-commit hook (e.g., secrets
# committed before the hook was installed, or injected via web editor).
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so we can scan old commits
      - name: Scan tracked files for known secret patterns
        run: bash scripts/pre-commit-secret-scan.sh
        # The hook normally scans only staged files; when run in CI
        # without args, git diff --cached is empty, so it exits 0.
        # We need to scan ALL tracked files here.
      - name: Full-repo secret scan
        run: |
          PATTERNS='(cfat_[A-Za-z0-9_-]{20,}|cft_[A-Za-z0-9_-]{20,}|sk_[a-f0-9]{32}|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|xox[abp]-[A-Za-z0-9-]{10,}|Bearer [A-Za-z0-9_-]{30,})'
          git ls-files | grep -vE '\.(png|jpg|jpeg|gif|pdf|mp3|mp4|wasm|woff2)$' \
            | grep -vE '^\.env$|^\.env\.example$|ielts-materials/' \
            | while read f; do
              HITS=$(git show "HEAD:$f" 2>/dev/null | grep -nE "$PATTERNS" || true)
              if [ -n "$HITS" ]; then
                echo "::error file=$f::Potential secret detected"
                echo "$HITS" | head -3
              fi
            done
      - name: Summarize
        if: failure()
        run: |
          echo "::error::Secret detected. Rotate the credential immediately."
          echo "  1. Revoke the old key in the provider dashboard."
          echo "  2. Issue a new key."
          echo "  3. Set it via 'wrangler secret put KEY_NAME'."
          echo "  4. Remove the key from any committed file."
          echo "  5. BFG / git-filter-repo to scrub from history if needed."